<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 92vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box{
            height: 150px;
            width: 150px;
            background-color: #3498db;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0px 6px 7px black;
            cursor: pointer;
            color: #fff;
            transition:3s background-color;
        }
        #box:hover{
            background-color: black;
            box-shadow: 0px 6px 7px white;

        }

    </style>
</head>
<body>
    <div id="main">
        <div id="box">
            <h1>BOX</h1>
        </div>
    </div>
</body>
</html>
